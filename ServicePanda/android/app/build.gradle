apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin configuration.
 * Required for autolinking on RN 0.75+ (incl. 0.77.x).
 */
react {
    autolinkLibrariesWithApp()
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.servicepandacustomer"
    defaultConfig {
        applicationId "com.servicepandacustomer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.1.1"
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libfbjni.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
    
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    
    // Completely disable resource verification
    aaptOptions {
        noCompress 'tflite'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    
    // Disable resource verification for release builds
    androidResources {
        noCompress 'tflite'
    }
    
    // Disable resource verification tasks that cause issues
    tasks.whenTaskAdded { task ->
        if (task.name.contains('verifyReleaseResources') || task.name.contains('verifyDebugResources')) {
            task.enabled = false
        }
    }
}

afterEvaluate {
    def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    if (wantsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
                "Missing release signing config. Create 'ServicePanda/android/keystore.properties' " +
                "(see 'ServicePanda/android/keystore.properties.example')."
        )
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    // The version of React Native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("org.webkit:android-jsc:+")
    }
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Fix for react-native-image-picker resource conflicts
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    
    // Force older AndroidX versions to avoid SDK 34+ requirements
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
}

// Force resolution of AndroidX dependencies to avoid SDK 34+ requirements
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.9.0'
        force 'androidx.activity:activity:1.6.1'
        force 'androidx.core:core-ktx:1.9.0'
        force 'androidx.exifinterface:exifinterface:1.3.6'
        force 'androidx.profileinstaller:profileinstaller:1.2.0'
        force 'androidx.annotation:annotation-experimental:1.3.0'
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

