# Gradle JVM options (increase memory for builds) - Force Java 17
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable AndroidX + Jetifier (required for RN)
android.useAndroidX=true
android.enableJetifier=true

# React Native specific flags
newArchEnabled=false
hermesEnabled=true

# React Native tasks are not configuration-cache safe
org.gradle.configuration-cache=false

# (Optional) Kotlin style
kotlin.code.style=official

# Java 17 configuration
org.gradle.java.version=17

# DEX configuration
android.enableR8.fullMode=false

# SDK versions (keep aligned with build.gradle ext)
android.compileSdkVersion=35
android.targetSdkVersion=35
android.buildToolsVersion=35.0.0

# Suppress unsupported compileSdk warning
android.suppressUnsupportedCompileSdk=35,36

# Fix react-native-image-picker resource verification issues
android.disableResourceValidation=true
android.enableResourceOptimizations=false
