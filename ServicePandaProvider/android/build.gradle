// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        // NDK r28+ is required for 16KB page-size alignment by default
        ndkVersion = "28.0.13004108"
        // Stripe Android 22.7.x is built with Kotlin 2.0+ metadata.
        // Kotlin 2.0.x is currently required to compile @stripe/stripe-react-native 0.58.0 on Android.
        kotlinVersion = "2.0.21"
        // Keep in sync with node_modules/@stripe/stripe-react-native/android/gradle.properties
        stripeVersion = "22.7.+"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.5.1+ is required for 16KB page-size packaging support
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// (No extra Kotlin compiler flags needed.)
