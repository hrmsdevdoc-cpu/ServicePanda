apply plugin: "com.android.application"
apply plugin: "com.facebook.react"


android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.servicepandaprovider"
    defaultConfig {
        applicationId "com.servicepandaprovider"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        multiDexEnabled true
        
        // Screen density and scaling configuration
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libfbjni.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
    
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    
    // Completely disable resource verification
    aaptOptions {
        noCompress 'tflite'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    
    // Disable resource verification for release builds
    androidResources {
        noCompress 'tflite'
    }
    
    // Disable resource verification tasks that cause issues
    tasks.whenTaskAdded { task ->
        if (task.name.contains('verifyReleaseResources') || task.name.contains('verifyDebugResources')) {
            task.enabled = false
        }
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("com.facebook.react:react-native:+")
    implementation("com.facebook.react:hermes-android")
    implementation project(':@react-native-async-storage_async-storage')
    implementation project(':react-native-image-crop-picker')
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Fix for react-native-image-picker resource conflicts
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    
    // Force older AndroidX versions to avoid SDK 34+ requirements
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
}

// Force resolution of AndroidX dependencies to avoid SDK 34+ requirements
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.9.0'
        force 'androidx.activity:activity:1.6.1'
        force 'androidx.core:core-ktx:1.9.0'
        force 'androidx.exifinterface:exifinterface:1.3.6'
        force 'androidx.profileinstaller:profileinstaller:1.2.0'
        force 'androidx.annotation:annotation-experimental:1.3.0'
    }
}
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
