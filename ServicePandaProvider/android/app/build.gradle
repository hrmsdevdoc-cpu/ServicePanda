apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.servicepandaprovider"
    defaultConfig {
        applicationId "com.servicepandaprovider"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.1"
        multiDexEnabled true
        
        // Screen density and scaling configuration
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                // keystoreProperties['storeFile'] is documented as relative to `android/`.
                // Some builds resolve rootProject at repo root, so try both locations.
                def storeFilePath = keystoreProperties['storeFile']
                def ksFile = rootProject.file(storeFilePath)
                if (!ksFile.exists()) {
                    ksFile = rootProject.file("android/${storeFilePath}")
                }
                storeFile ksFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            debuggable false
        }
    }

    packagingOptions {
        // Required for Google Play 16KB page-size compatibility checks on apps shipping native libs.
        // Ensures native libs are packaged in the modern format (no legacy packaging that can break alignment).
        jniLibs {
            useLegacyPackaging = false
        }

        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libreactnativejni.so'
        pickFirst '**/libfbjni.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
    
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    
    // Completely disable resource verification
    aaptOptions {
        noCompress 'tflite'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    
    // Disable resource verification for release builds
    androidResources {
        noCompress 'tflite'
    }
    
    // Disable resource verification tasks that cause issues
    tasks.whenTaskAdded { task ->
        if (task.name.contains('verifyReleaseResources') || task.name.contains('verifyDebugResources')) {
            task.enabled = false
        }
    }

    // Ensure assets are included
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Exclude conflicting resources
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude '**/META-INF/DEPENDENCIES'
        exclude '**/META-INF/LICENSE'
        exclude '**/META-INF/LICENSE.txt'
        exclude '**/META-INF/license.txt'
        exclude '**/META-INF/NOTICE'
        exclude '**/META-INF/NOTICE.txt'
        exclude '**/META-INF/notice.txt'
        exclude '**/META-INF/ASL2.0'
        exclude '**/META-INF/*.kotlin_module'
    }
}

afterEvaluate {
    def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    if (wantsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
                "Missing release signing config. Create 'ServicePandaProvider/android/keystore.properties' " +
                "(see 'ServicePandaProvider/android/keystore.properties.example')."
        )
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    // The version of React Native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("org.webkit:android-jsc:+")
    }
    
    // OneSignal SDK
    implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Fix for react-native-image-picker resource conflicts
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    
    // Force older AndroidX versions to avoid SDK 34+ requirements
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
}

// Force resolution of AndroidX dependencies to avoid SDK 34+ requirements
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.9.0'
        force 'androidx.activity:activity:1.6.1'
        force 'androidx.core:core-ktx:1.9.0'
        force 'androidx.exifinterface:exifinterface:1.3.6'
        force 'androidx.profileinstaller:profileinstaller:1.2.0'
        force 'androidx.annotation:annotation-experimental:1.3.0'
    }
}
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
