# Gradle JVM options (increase memory for builds) - Force Java 17
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.16.8-hotspot

# Enable AndroidX + Jetifier (required for RN)
android.useAndroidX=true
android.enableJetifier=true

# React Native specific flags
newArchEnabled=false
hermesEnabled=true

# Enable faster builds
org.gradle.configuration-cache=true

# (Optional) Kotlin style
kotlin.code.style=official

# Java 17 configuration
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.16.8-hotspot
org.gradle.java.version=17

# DEX configuration
android.enableR8.fullMode=false

# Force SDK version to avoid android-35 issues
android.compileSdkVersion=33
android.targetSdkVersion=33
android.buildToolsVersion=33.0.0

# Suppress unsupported compileSdk warning
android.suppressUnsupportedCompileSdk=33

# Fix react-native-image-picker resource verification issues
android.enableResourceOptimizations=false