# Gradle JVM options (increase memory for builds) - Force Java 17
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.16.8-hotspot

# Enable AndroidX + Jetifier (required for RN)
android.useAndroidX=true
android.enableJetifier=true

# React Native specific flags
newArchEnabled=false
